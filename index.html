/* ===== Skin « Belle Époque féerique » : parchemin, laiton, vert-de-gris ===== */
:root{
  --bg:#efe5cf; --surface:#fbf6e8; --surface2:#e8dcc0; --fg:#2a2017; --muted:#766650; --line:#cdb98f;
  --accent:#1d6b66; --accent-fg:#fbf6e8; --accent-soft:#cde3dc;
  --brass:#b0852f; --brass-hi:#e6c46e; --brass-lo:#7d5a1c;
  --bar-hi:#46a198; --bar:#1d6b66; --bar-lo:#134a46;
  --plan:#9c5a18; --plan-soft:#f0d9b0;
  --good:#43763a; --good-soft:#dbe7c6; --bad:#9a2c32; --bad-soft:#f0d2ca;
  --paper:rgba(255,255,255,.45); --grain:rgba(120,90,40,.04);
  --font-display:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif; --font-label:'Cinzel',Georgia,serif;
  --shadow:0 -8px 30px rgba(40,25,10,.3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b1e; --surface:#172a2e; --surface2:#203a3f; --fg:#f0e4c8; --muted:#a99c80; --line:#35504f;
  --accent:#e2b955; --accent-fg:#10201f; --accent-soft:#3b3920;
  --brass:#e2b955; --brass-hi:#f6dc94; --brass-lo:#a07a28;
  --bar-hi:#f6dc94; --bar:#e2b955; --bar-lo:#a07a28;
  --plan:#e8934a; --plan-soft:#42301a; --good:#93d08a; --good-soft:#1f3a2a; --bad:#ff9382; --bad-soft:#47231f;
  --paper:rgba(226,185,85,.07); --grain:rgba(226,185,85,.025); --shadow:0 -8px 30px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1e; --surface:#172a2e; --surface2:#203a3f; --fg:#f0e4c8; --muted:#a99c80; --line:#35504f;
  --accent:#e2b955; --accent-fg:#10201f; --accent-soft:#3b3920;
  --brass:#e2b955; --brass-hi:#f6dc94; --brass-lo:#a07a28;

const LABEL={feerie:'Féerie',masque:'Masque',fortune:'Fortune',atout:'Atouts féeriques',spec:'Spécialités'};
const STAGES=[{nom:'Profond',feerie:7,carac:6,comp:6,atout:4},{nom:'Légendaire',feerie:8,carac:7,comp:7,atout:5}];
const PALIER_MAX=7; /* seules les compétences dont le niveau max est ≥ 7 comptent pour Profond et Légendaire */
function lvlCost(kind,l){if(kind==='atout'||kind==='spec')return RULES[kind];if(kind==='carac'&&l===2)return 12;return l*RULES[kind];}
function cum(kind,from,to){let s=0;for(let l=from+1;l<=to;l++)s+=lvlCost(kind,l);return s;}
function ref(c,key){
  const i=key.indexOf(':'),k=i<0?key:key.slice(0,i),n=i<0?'':key.slice(i+1);
  if(k==='feerie'||k==='masque'||k==='fortune'||k==='atout'||k==='spec'){const o=c[k];return o?{kind:k,nom:LABEL[k],o,max:k==='spec'?null:o.max}:null;}
  if(k==='carac'){const o=c.carac&&c.carac[n];return o?{kind:'carac',nom:n,o,max:o.max}:null;}
  if(k==='comp'){for(const p of c.profils||[])for(const x of p.comps||[])if(x.nom===n)return{kind:'comp',nom:n,o:x,max:x.max};return null;}
  if(k==='fut'){const x=(c.futiles||[]).find(f=>f.nom===n);return x?{kind:'fut',nom:n,o:x,max:x.max}:null;}
  if(k==='prof'){const x=(c.profils||[]).find(f=>f.nom===n);return x?{kind:'prof',nom:n,o:x,max:x.max}:null;}
  return null;
}
function lv(c,key){const r=ref(c,key);return r?(r.o.cur||0):0;}
function tricherie(c){return Math.floor((lv(c,'feerie')+lv(c,'masque'))/2);}
function derivedBase(c){
  const A=n=>lv(c,'carac:'+n);
  if(c.type==='PNJ'){const P=n=>lv(c,'prof:'+n);return [['PdV',9+A('Constitution')*3],['Esquive',5+A('Agilité')+P('Aventurier')],['Parade',5+A('Agilité')+P('Combattant')],['Résistance physique',5+A('Constitution')+P('Aventurier')],['Résistance psychique',5+A('Esprit')+P('Erudit')],['Initiative',P('Combattant')+Math.max(A('Sang Froid'),A('Perception'))],['Base mêlée',A('Agilité')+P('Combattant')],['Base tir',A('Précision')+P('Combattant')]];}
  const C=n=>lv(c,'comp:'+n),mb=Math.max(0,lv(c,'masque')-5);
  return [['PdV',9+A('Constitution')*3],['Esquive',5+A('Agilité')+C('Mouvement')],['Parade',5+A('Agilité')+C('Mêlée')],['Résistance physique',5+A('Constitution')+C('Ressort')+mb],['Résistance psychique',5+A('Esprit')+C('Fortitude')+mb],['Initiative',C('Art de la guerre')+Math.max(A('Sang Froid'),A('Perception'))],['Base mêlée',A('Agilité')+C('Mêlée')],['Base tir',A('Précision')+C('Tir')]];
}
function derived(c){return derivedBase(c).map(([n,v])=>{const b=(c.bonus&&c.bonus[n])||0;return [n,v+b,b];});}
function rankOf(c,p){if(c.type==='PNJ')return p.cur||0;const cs=p.comps||[];return Math.floor(cs.reduce((s,x)=>s+(x.cur||0),0)/4);}
function nextRank(c,p){
  if(c.type==='PNJ'){const cur=p.cur||0;if(cur>=p.max)return null;return{cost:cum('prof',cur,cur+1),steps:[]};}
  const cs=p.comps.map(x=>({nom:x.nom,cur:x.cur||0,max:x.max}));
  let sum=cs.reduce((s,x)=>s+x.cur,0);const need=4*(Math.floor(sum/4)+1);let cost=0;const steps=[];
  while(sum<need){let b=null;for(const x of cs){if(x.cur>=x.max)continue;const k=lvlCost('comp',x.cur+1);if(!b||k<b.k)b={x,k};}
    if(!b)return null;cost+=b.k;steps.push(b.x.nom+' '+(b.x.cur+1));b.x.cur++;sum++;}
  return{cost,steps};
}
function sessTotal(events,sid,pj){let t=0;for(const e of events)if(e.id===sid||e.sessionId===sid)for(const en of e.entries)if(en.perso===pj)t+=en.montant;return t;}
/* Part d'un PNJ rattaché à un PJ : 50 % des gains du PJ dans la session s'il a participé, 25 % sinon, arrondi à l'inférieur.
   Ne s'applique qu'aux sessions datées à partir du jour du rattachement. */
function pnjShares(c,events){if(!c||c.type!=='PNJ'||!c.pj||!c.pjDate)return [];const out=[];
  for(const e of events){if(!e.session||e.rattrapage||e.reprise||(e.date||'')<c.pjDate)continue;const on=!!(e.pnj&&e.pnj[c.id]),pct=on?50:25,base=sessTotal(events,e.id,c.pj),m=Math.floor(base*pct/100);
    out.push({sess:e.id,on,pct,base,montant:m,nature:'PNJ ('+pct+' %)'});}return out;}
function gainsOf(c,events){const by={};let t=0;for(const e of events)for(const en of e.entries)if(en.perso===c.id){by[en.nature]=(by[en.nature]||0)+en.montant;t+=en.montant;}
  for(const sh of pnjShares(c,events))if(sh.montant){by[sh.nature]=(by[sh.nature]||0)+sh.montant;t+=sh.montant;}return{by,total:t};}
function spent(c){return (c.achats||[]).reduce((s,a)=>s+(a.cout||0),0);}
function planItems(c){const out=[];for(const key of Object.keys(c.plan||{})){const to=c.plan[key];const r=ref(c,key);if(!r)continue;const cur=r.o.cur||0;if(to>cur)out.push({key,nom:r.nom,kind:r.kind,from:cur,to,cost:cum(r.kind,cur,to)});}return out;}
function summary(c,events){const g=gainsOf(c,events).total,d=spent(c),dispo=g-d,pl=planItems(c),prevu=pl.reduce((s,x)=>s+x.cost,0);return{gains:g,spent:d,dispo,prevu,manque:Math.max(0,prevu-dispo),plan:pl};}
function bestOf(c,kind,keys,label,target){
  let best=0,cheap=null;
  for(const k of keys){const r=ref(c,k);if(!r||(kind==='comp'&&(r.max||0)<PALIER_MAX))continue;const cur=r.o.cur||0;best=Math.max(best,cur);if(cur>=target||r.max<target)continue;const cost=cum(kind,cur,target);if(!cheap||cost<cheap.cost)cheap={cost,nom:r.nom};}
  if(best>=target)return{label,cur:best,target,cost:0,via:null,blocked:false};
  return{label,cur:best,target,cost:cheap?cheap.cost:null,via:cheap?cheap.nom:null,blocked:!cheap};
}
function gaugesFor(c,st){
  const f=c.feerie,a=c.atout,ck=[];for(const p of c.profils||[])for(const x of p.comps||[])ck.push('comp:'+x.nom);
  return [
    {label:'Féerie',cur:f.cur,target:st.feerie,cost:f.cur>=st.feerie?0:cum('feerie',f.cur,st.feerie),via:null,blocked:f.max<st.feerie},
    bestOf(c,'carac',CARACS.map(n=>'carac:'+n),'Une caractéristique',st.carac),
    bestOf(c,'comp',ck,'Une compétence',st.comp),
    {label:'Atouts féeriques',cur:a.cur,target:st.atout,cost:a.cur>=st.atout?0:cum('atout',a.cur,st.atout),via:null,blocked:false}
  ];
}
function paliers(c){
  if(c.type!=='PJ')return null;
  for(const st of STAGES){const gs=gaugesFor(c,st);const ok=gs.every(g=>g.cost===0&&g.cur>=g.target);
    if(!ok)return{stage:st.nom,gauges:gs,total:gs.reduce((s,g)=>s+(g.cost||0),0),done:false,blocked:gs.some(g=>g.blocked)};}
  return{stage:'Légendaire',gauges:[],total:0,done:true,blocked:false};
}
const clone=o=>JSON.parse(JSON.stringify(o));
const AUTRES=['Domaine','Triche','PNJ'];
function autreTotal(c,nom){return (c.achats||[]).filter(a=>a.key==='autre:'+nom).reduce((s,a)=>s+(a.cout||0),0);}
function lastAutre(c,nom){const A=c.achats||[];for(let i=A.length-1;i>=0;i--)if(A[i].key==='autre:'+nom)return A[i];return null;}
function spendAutre(c,nom,pts,today){const n=clone(c);n.achats=n.achats||[];n.achats.push({id:'a'+Date.now().toString(36)+Math.floor(Math.random()*1e3),date:today,label:'Dépense · '+nom,cout:pts,key:'autre:'+nom});return n;}
function undoAutre(c,nom){const a=lastAutre(c,nom);if(!a)return null;const n=clone(c);n.achats=n.achats.filter(x=>x.id!==a.id);return{c:n,refund:a.cout||0};}
const NOMRE=/^\s*(atouts?\s+f[ée]eriques?|sp[ée]cialit[ée]s?)\s*\((.+)\)\s*$/i;
function nameList(c,kind){const out=[];for(const a of c.achats||[]){const m=NOMRE.exec(a.label||'');if(!m)continue;const k=/^atout/i.test(m[1])?'atout':'spec';const n=m[2].trim();if(k!==kind||/^\d+\s*(→|->)\s*\d+$/.test(n))continue;out.push(n);}return out.concat((c.noms&&c.noms[kind])||[]);}
function normNoms(c){for(const k of ['atout','spec']){if(c[k]){const n=nameList(c,k).length;if((c[k].cur||0)<n)c[k].cur=n;}}return c;}
function buy(c,key,to,today,nom){
  const n=clone(c),r=ref(n,key),from=r.o.cur||0,cost=cum(r.kind,from,to);r.o.cur=to;
  const label=nom?(r.kind==='atout'?`Atout féerique (${nom})`:`Spécialité (${nom})`):(r.kind==='atout'||r.kind==='spec')?`${r.nom} (${from}→${to})`:`${r.nom} ${to}`;
  n.achats=n.achats||[];n.achats.push({id:'a'+Date.now().toString(36)+Math.floor(Math.random()*1e3),date:today,label,cout:cost,key,from,to});
  if(n.plan&&n.plan[key]!==undefined&&n.plan[key]<=to)delete n.plan[key];
  return n;
}
function canUndo(c,a){if(!a||!a.key)return false;const r=ref(c,a.key);return !!r&&(r.o.cur||0)===a.to;}
function lastBuy(c,key){const r=ref(c,key);if(!r)return null;const cur=r.o.cur||0;const A=c.achats||[];
  if(r.kind==='atout'||r.kind==='spec'){if(cur<1)return null;for(let i=A.length-1;i>=0;i--)if(A[i].key===key&&A[i].from<A[i].to)return A[i];return null;}
 for(let i=A.length-1;i>=0;i--){const a=A[i];if(a.key===key&&a.to===cur&&a.from<cur)return a;}return null;}
function undoLevel(c,key){const a=lastBuy(c,key);if(!a)return null;const n=clone(c),r=ref(n,key),cur=r.o.cur||0,na=n.achats.find(x=>x.id===a.id);let refund;
  if(a.to-a.from<=1){refund=na.cout||0;n.achats=n.achats.filter(x=>x.id!==a.id);}
  else{refund=Math.min(na.cout||0,lvlCost(r.kind,cur));na.cout=(na.cout||0)-refund;na.to=cur-1;na.label=(r.kind==='atout'||r.kind==='spec')?`${r.nom} (${na.from}→${na.to})`:`${r.nom} ${na.to}`;}
  r.o.cur=cur-1;return{c:n,refund,from:cur,to:cur-1};}
function undo(c,id){const n=clone(c),a=(n.achats||[]).find(x=>x.id===id);if(!a||!canUndo(n,a))return n;ref(n,a.key).o.cur=a.from;n.achats=n.achats.filter(x=>x.id!==id);return n;}

function cancelAchat(c,id){const n=clone(c),a=(n.achats||[]).find(x=>x.id===id);if(!a)return{c:n,reverted:false};let rev=false;if(a.key){const r=ref(n,a.key);if(r&&(r.kind==='atout'||r.kind==='spec')){if((r.o.cur||0)>0){r.o.cur=r.o.cur-1;rev=true;}}else if(r&&(r.o.cur||0)===a.to){r.o.cur=a.from;rev=true;}}n.achats=n.achats.filter(x=>x.id!==id);return{c:n,reverted:rev};}
function editAchat(c,id,p){const n=clone(c),a=(n.achats||[]).find(x=>x.id===id);if(a){if(p.label!==undefined)a.label=p.label;if(p.cout!==undefined)a.cout=p.cout;if(p.date!==undefined)a.date=p.date||null;}return n;}
/* Rattrapage : XP à attribuer pour rejoindre le PJ juste devant (parmi ceux comptés dans la moyenne) */
function rattrapage(rows,r){const up=rows.filter(x=>(x.c.statut||'actif')==='actif'&&!x.c.cache&&!x.c.horsMoyenne&&x.total>r.total).sort((a,b)=>a.total-b.total)[0];return up?{c:up.c,total:up.total,montant:up.total-r.total}:null;}
function gainsTable(list,events){
  const part=list.filter(c=>(c.statut||'actif')==='actif'&&!c.cache&&!c.horsMoyenne);
  const avg=part.length?part.reduce((s,c)=>s+gainsOf(c,events).total,0)/part.length:0;
  return{avg,rows:list.map(c=>{const g=gainsOf(c,events),act=(c.statut||'actif')==='actif'&&!c.horsMoyenne;return{c,total:g.total,by:g.by,delta:g.total-avg,alert:act&&avg>0&&g.total<=avg-GAP};})};
}
function newChar(id,court,nom,type){
  const caracs=Object.fromEntries(CARACS.map(n=>[n,{max:6,cur:1}]));
  const base={id,court,nom:nom||court,type,statut:'actif',carac:caracs,spec:{cur:0},plan:{},achats:[]};
  if(type==='PNJ'){base.profils=PROFILS.map(n=>({nom:n,max:6,cur:0,subs:[]}));return base;}
  base.feerie={max:8,cur:0};base.masque={max:9,cur:0};base.fortune={max:15,cur:0};base.atout={max:8,cur:0};
  base.profils=PROFILS.map(n=>({nom:n,max:6,note:null,comps:PROFCOMPS[n].map(x=>({nom:x,max:6,cur:0}))}));base.futiles=[];
  return base;
}
function evType(e){if(e.type)return e.type;const t=e.titre||'';if(/^\s*\[\s*int/i.test(t))return 'Interscénario';if(/epilogue/i.test(t))return 'Autre';if(/^\s*S\.?\s*\d/i.test(t))return 'Scénario';return 'Autre';}
function scenarioCount(events){return events.filter(e=>evType(e)==='Scénario').length;}
function starCount(events,delta){return Math.max(0,Math.min(STARS,scenarioCount(events)+(delta||0)));}

const queue={};
function chain(path,fn){queue[path]=(queue[path]||Promise.resolve()).then(fn).then(()=>setSync('ok')).catch(e=>{console.error(e);setSync('err','Enregistrement refusé');});}
function persist(path,data){if(DB)chain(path,()=>DB.doc(path).set(data));}

const STATUTS={actif:'Actif',mort:'Décédé',retire:'Retiré'};

/* --- vues --- */
function teamCard(c){
  const s=summary(c,S.events),p=paliers(c),off=!actif(c);
  let stage='';
  if(p&&!off){stage=p.done?`<span class="pill good">Légendaire atteint</span>`:`<span class="pill acc">${p.stage} : ${p.blocked?'hors de portée':p.total+' XP'}</span>`;}
  const plan=off?`<span class="pill">${STATUTS[c.statut]||''}</span>`:s.prevu?`${s.manque?`<span class="pill bad">Il manque ${s.manque}</span>`:''}<span class="pill plan">Prévu ${s.prevu}</span>`:`<span class="pill">Rien de prévu</span>`;
  const img=portrait(c);
  return `<button class="card team${off?' off':''}" data-act="sel" data-id="${c.id}"><span class="thead"><span class="tph">${img?`<img src="${img}" alt="">`:`<span class="ini">${esc((c.court||'?').slice(0,1))}</span>`}</span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="nm">${esc(c.court)}</span><span class="muted small">${whoLine(c)}${c.cache?' · masqué aux autres':''}</span></span></span>
    <span class="big num">${s.dispo}</span><span class="muted small">XP disponibles · ${s.gains} gagnés, ${s.spent} dépensés</span>
    <span style="display:flex;gap:6px;flex-wrap:wrap">${plan}${stage}</span></button>`;
}
function heritageCard(){

  let st='';for(let i=1;i<=STARS;i++)st+=`<button class="star${i<=n?' on':''}" data-act="star" data-n="${i}" aria-pressed="${i<=n}" aria-label="Étoile ${i} sur ${STARS}">${i<=n?'★':'☆'}</button>`;
  return `<div class="card"><div class="prof-head"><b style="font-family:var(--font-display);font-size:18px">Rang d'héritage</b><span class="pill plan">${n} / ${STARS} étoiles</span></div><div class="frow" style="margin-bottom:6px"><div class="field"><label for="hs">Score</label><input id="hs" type="number" inputmode="numeric" data-her="score" value="${esc(S.heritage.score)}"></div></div><div class="stars">${st}</div><div class="muted small" style="margin-top:6px">Une étoile se remplit à chaque gain de type Scénario (${auto} joués). Touche une étoile pour corriger à la main${adj?' · ajusté de '+(adj>0?'+':'')+adj:''}.${adj?' <button class="btn ghost" style="padding:2px 8px" data-act="starReset">Annuler l\'ajustement</button>':''}</div></div>`;
}

    if(S.futForm.open)h+=`<div class="frow" style="margin-top:10px"><div class="field"><label for="fn">Nom</label><input id="fn" type="text" data-fut="nom" value="${esc(S.futForm.nom)}"></div><div class="field"><label for="fm">Niveau max</label><input id="fm" type="number" min="1" max="12" data-fut="max" value="${esc(S.futForm.max)}"></div></div><div class="actions"><button class="btn pri" data-act="futSave">Ajouter</button><button class="btn" data-act="futCancel">Annuler</button></div>`;

      h+=`<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><b>Total restant</b><b class="num">${p.blocked?'—':p.total+' XP'}</b></div>`;
      if(!p.blocked)h+=`<div class="muted small">${p.total<=s.dispo?'Finançable avec les XP disponibles.':'Il manque '+(p.total-s.dispo)+' XP par rapport au solde disponible.'}</div>`;

  const ach=[...(c.achats||[])].reverse();
  h+=`<h2>Historique des achats</h2><div class="card"><div class="muted small" style="margin-bottom:6px">${ach.length} achats · ${s.spent} XP dépensés · touche un achat pour le modifier ou l'annuler</div>`;
  const shown=S.hist[id]?ach:ach.slice(0,8);

  h+=`</div>`;
  return h;

const allPJ=()=>Object.values(S.chars).filter(c=>c.type==='PJ'&&actif(c)&&!c.cache).map(c=>c.id);
const lp=l=>l.persos!=null?l.persos:(l.nature==='Scénario'||l.nature==='Groupe')?allPJ():[];

const sessList=()=>S.events.filter(e=>e.session&&!e.rattrapage).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||S.events.indexOf(b)-S.events.indexOf(a));
const sessById=id=>S.events.find(e=>e.id===id&&e.session);
function curSession(){const L=sessList();if(S.curSess&&L.some(e=>e.id===S.curSess))return sessById(S.curSess);return L[0]||null;}
/* PJ présents d'une session : liste enregistrée, sinon déduite (PJ ayant du Scénario, à défaut un gain quelconque) */
function presents(e){if(!e)return [];const isPJ=i=>S.chars[i]&&S.chars[i].type==='PJ';if(Array.isArray(e.pj))return e.pj.filter(isPJ);
  const sc=[...new Set(e.entries.filter(x=>x.nature==='Scénario'&&x.montant&&isPJ(x.perso)).map(x=>x.perso))];if(sc.length)return sc;
  return [...new Set(e.entries.filter(x=>x.montant&&isPJ(x.perso)).map(x=>x.perso))];}
const orderPJ=a=>{const o=pjIds();return [...a].sort((x,y)=>{const i=o.indexOf(x),j=o.indexOf(y);return (i<0?99:i)-(j<0?99:j);});};
/* Destinataires d'une ligne de saisie dans une session : Scénario → présents, Groupe → PJ actifs, Individuel → choix parmi les présents */
function slp(l,cs){if(l.nature==='Scénario')return presents(cs);if(l.nature==='Groupe')return allPJ();const pr=presents(cs);return (l.persos||[]).filter(p=>pr.includes(p));}
/* Modifier par nature : Scénario → présents ; Groupe → PJ qui l'ont déjà (sinon PJ actifs) ; Individuel → présents + ceux qui en ont */
function natTargets(e,n){if(n==='Scénario')return presents(e);const has=[...new Set(e.entries.filter(x=>x.nature===n&&x.montant&&S.chars[x.perso]&&S.chars[x.perso].type==='PJ').map(x=>x.perso))];return has.length?has:allPJ();}
function natList(e,g){return orderPJ([...new Set([...presents(e),...Object.keys(g.vals).filter(i=>+g.vals[i])])]).filter(i=>S.chars[i]&&vis(S.chars[i]));}
function modeOf(a){const c={};let b=null;for(const v of a){c[v]=(c[v]||0)+1;if(b===null||c[v]>c[b])b=v;}return b;}
/* Début d'intitulé proposé : numéro suivant le plus grand déjà utilisé pour ce type */
function sessPrefix(type){
  const re=type==='Scénario'?/^S\.?\s*0*(\d+)/i:type==='Interscénario'?/^\[\s*Int\.?\s*0*(\d+)/i:null;if(!re)return '';
  let n=0;for(const e of S.events)if(e.session&&evType(e)===type){const m=(e.titre||'').match(re);if(m)n=Math.max(n,+m[1]);}
  return type==='Scénario'?'S'+String(n+1).padStart(2,'0')+'. ':'[Int. '+String(n+1).padStart(3,'0')+'] ';
}
const sessLabel=e=>e?esc(e.titre)+(e.date?' · '+fmtDate(e.date):e.textuelle?' · Session textuelle':''):'';
const sessChildren=id=>S.events.filter(e=>e.sessionId===id);
function sessOptions(sel){return `<option value="">Aucune session</option>`+sessList().map(e=>`<option value="${e.id}"${e.id===sel?' selected':''}>${sessLabel(e)}</option>`).join('');}
function pnjAttached(){return Object.values(S.chars).filter(c=>c.type==='PNJ'&&c.pj&&S.chars[c.pj]&&vis(c)).sort((a,b)=>(a.court||'').localeCompare(b.court||''));}

    const P=pnjAttached();
    if(P.length){
      h+=`<div class="pnjbox"><h3>PNJ · part calculée sur la session</h3>`+P.map(c=>{const sh=pnjShares(c,S.events).find(x=>x.sess===cs.id),pj=S.chars[c.pj];

        `<div class="muted small" style="margin-top:6px">Interrupteur : a participé activement (50 %), sinon 25 %. Arrondi à l'inférieur, mis à jour automatiquement si un gain est rattaché plus tard.</div></div>`;

}
function gainsTableAndJournal(){

    gt.rows.map(r=>{const c=r.c,off=!actif(c)||c.horsMoyenne;const d=Math.round(r.delta);
      const rt=r.alert?rattrapage(gt.rows,r):null;
      return `<tr class="${r.alert?'alert':off?'off':''}"><td>${r.alert?'<span aria-label="Alerte">⚠</span> ':''}${esc(c.court)}${rt?` <button class="ratbtn" data-act="ratOpen" data-id="${c.id}" title="Rattrapage d'XP" aria-label="Rattrapage d'XP pour ${esc(c.court)}">↑</button>`:''}${!actif(c)?' <span class="pill">'+(STATUTS[c.statut]||'')+'</span>':''}${c.horsMoyenne&&actif(c)?' <span class="pill">hors moyenne</span>':''}</td>${nat.map(n=>`<td>${r.by[n]||'·'}</td>`).join('')}<td><b>${r.total}</b></td><td>${off?'·':(d>0?'+'+d:d<0?'−'+(-d):'0')}</td></tr>`;}).join('')+
    `<tr class="avg"><td>Moyenne du groupe</td>${nat.map(()=>'<td></td>').join('')}<td><b>${Math.round(gt.avg*10)/10}</b></td><td></td></tr></tbody></table></div></div>`;

  h+=`<h2>Journal</h2><div class="card">`;
  const pv=c=>{const ch=S.chars[c];return ch&&ch.type==='PJ'&&vis(ch);};
  const grpTags=ents=>{const grp={};for(const en of ents){const k=en.nature+' +'+en.montant;(grp[k]=grp[k]||[]).push(S.chars[en.perso].court);}return grp;};
  const top=[...S.events].reverse().filter(e=>!e.sessionId||!sessById(e.sessionId));
  const first=top.find(e=>e.session);S.jOpen=S.jOpen||{};
  h+=top.map(e=>{
    if(e.session){
      const open=e.id in S.jOpen?S.jOpen[e.id]:e===first;
      if(!open)return `<div class="sess"><div class="shead tg" data-act="sessToggle" data-id="${e.id}" role="button" tabindex="0" aria-expanded="false"><span class="chev" aria-hidden="true">›</span><div style="min-width:0"><div class="t" style="font-size:17px">${esc(e.titre)}</div><div class="muted small">${[e.date?fmtDate(e.date):e.textuelle?'Session textuelle':'',esc(evType(e))].filter(Boolean).join(' · ')}</div>${(()=>{const pr=orderPJ(presents(e));return pr.length?`<div class="muted small" style="margin-top:2px">👥 ${pr.map(i=>esc(S.chars[i].court)).join(', ')}</div>`:'';})()}</div></div></div>`;
      const kids=sessChildren(e.id);
      let body='';
      const NCL={Scénario:'n-sc',Groupe:'n-gr',Individuel:'n-in'},ord=pjIds(),by={};
      for(const en of e.entries){if(!pv(en.perso))continue;(by[en.nature]=by[en.nature]||{});by[en.nature][en.perso]=(by[en.nature][en.perso]||0)+en.montant;}
      const nats=NATURES.filter(n=>by[n]).concat(Object.keys(by).filter(n=>!NATURES.includes(n)));
      for(const n of nats){const o=by[n],ps=Object.keys(o).filter(p=>o[p]).sort((a,b)=>ord.indexOf(a)-ord.indexOf(b));if(!ps.length)continue;const cl=NCL[n]||'acc',nm=p=>esc(S.chars[p].court);
        const btn=`<button class="btn ghost" style="padding:4px 10px;flex:none" data-act="natEdit" data-id="${e.id}" data-n="${esc(n)}">Modifier</button>`;
        if(n==='Individuel'){body+=`<div class="nb"><div class="nbh"><b>${esc(n)}</b>${btn}</div><div class="nbl">${ps.map(p=>`<span class="xpi">${nm(p)} <span class="xpn">+${o[p]}</span></span>`).join(', ')}</div></div>`;continue;}
        const g={};for(const p of ps)(g[o[p]]=g[o[p]]||[]).push(p);const ks=Object.keys(g).sort((a,b)=>b-a);
        body+=`<div class="nb"><div class="nbh"><span class="nt"><b>${esc(n)}</b>${ks.length===1?`<span class="xpn">+${ks[0]}</span>`:''}</span>${btn}</div><div class="nbl">${ks.length===1?`<span class="muted small">${g[ks[0]].map(nm).join(', ')}</span>`:ks.map(m=>`<div><span class="xpn">+${m}</span> <span class="muted small">${g[m].map(nm).join(', ')}</span></div>`).join('')}</div></div>`;}
      body+=kids.map(k=>{const ents=k.entries.filter(en=>pv(en.perso));if(!ents.length)return '';const g=grpTags(ents);return `<div class="sline"><div style="min-width:0"><div>${esc(k.titre)}</div><div class="tags">${Object.keys(g).map(x=>`<span class="pill acc">${esc(x)}</span><span class="muted small">${g[x].length===allPJ().length?'tous les PJ actifs':esc(g[x].join(', '))}</span>`).join(' ')}</div></div><span class="locked" style="max-width:110px;text-align:right">Se corrige depuis Univers › ${k.creature?'Créatures':'Secrets'}</span></div>`;}).join('');
      {const pn=[];let calc=false,rep=false;
        for(const en of e.entries){const ch=S.chars[en.perso];if(!ch||ch.type!=='PNJ'||!vis(ch)||!en.montant)continue;const x=pn.find(y=>y.id===en.perso&&y.n===en.nature);if(x)x.m+=en.montant;else pn.push({id:en.perso,n:en.nature,m:en.montant});rep=true;}
        for(const c of Object.values(S.chars)){if(c.type!=='PNJ'||!vis(c))continue;const sh=pnjShares(c,S.events).find(x=>x.sess===e.id);if(sh&&sh.montant){pn.push({id:c.id,n:sh.nature,m:sh.montant});calc=true;}}
        if(pn.length)body+=`<div class="nb"><div class="nbh"><b>PNJ</b><span class="locked" style="text-align:right">${calc&&rep?'Calculée ou reprise':calc?'Calculée automatiquement':'Reprise de l\'ancien journal'}</span></div><div class="nbl">${pn.map(x=>{const m=(x.n||'').match(/\((\d+) %\)/);return `<div>${esc(S.chars[x.id].court)} <span class="xpn">+${x.m}</span>${m?' ('+m[1]+' %)':''}</div>`;}).join('')}</div></div>`;}
      const blocked=kids.filter(k=>!(k.secret&&k.secret.k==='bonus')).length;

    }
    const ents=e.entries.filter(en=>pv(en.perso));if(!ents.length)return '';
    const g=grpTags(ents);
    const tags=Object.keys(g).map(k=>`<span class="pill acc">${esc(k)}</span><span class="muted small">${esc(g[k].join(', '))}</span>`).join(' ');
    return `<div class="ev"><div style="min-width:0"><div class="t">${esc(e.titre)}</div><div class="muted small">${e.date?fmtDate(e.date):'sans date'} · ${evType(e)}</div><div class="tags">${tags}</div></div>${e.secret||e.creature?`<span class="locked" style="flex:none;max-width:120px;text-align:right">Se corrige depuis Univers › ${e.creature?'Créatures':'Secrets'}</span>`:`<span style="display:flex;gap:6px;flex:none"><button class="btn ghost" style="padding:4px 10px" data-act="gainEdit" data-id="${e.id}">Modifier</button><button class="btn ghost" style="padding:4px 10px" data-act="gainDel" data-id="${e.id}">Supprimer</button></span>`}</div>`;
  }).join('')||'<div class="muted">Aucun gain enregistré.</div>';

}

const secLabel=s=>'Secret '+(ROMAN[s.n-1]||s.n)+(s.titre?' - '+s.titre:'');
const secCount=(s,k)=>{const a=(s.slots&&s.slots[k])||[];return [a.filter(Boolean).length,a.length];};
const secFree=(s,k)=>k==='titre'?(s.titre?0:1):secCount(s,k)[1]-secCount(s,k)[0];
const secComplete=s=>{const [f,t]=secCount(s,'vm');return t>0&&f===t;};
function secPts(s){let p=s.titre?(s.titrePts||1):0;for(const k of ['vm','vmin','h'])for(const x of (s.slots[k]||[]))if(x)p+=x.pts||0;if(s.bonus)p+=SEC_BONUS;return p;}
function secPips(s,k){const [f,t]=secCount(s,k),K=SKIND[k];return t?K.g.repeat(f)+K.o.repeat(t-f):'—';}
const secById=n=>S.secrets.find(s=>s.n===n);
function viewUnivers(){
  let h=`<div class="subtabs" role="group" aria-label="Sections de l'univers"><button data-act="uni" data-v="secrets" aria-pressed="${S.uni!=='creatures'}">Secrets</button><button data-act="uni" data-v="creatures" aria-pressed="${S.uni==='creatures'}">Créatures</button></div>`;
  if(S.uni==='creatures')return h+viewCreatures();
  if(!S.secretsReady)return h+`<div class="card empty">Chargement des secrets…</div>`;
  const s=S.sec!=null&&secById(S.sec);
  return h+(s?viewSecret(s):viewSecretList());
}
function viewSecretList(){
  const L=S.secrets,tot=L.reduce((a,s)=>a+secPts(s),0),nt=L.filter(s=>s.titre).length,nb=L.filter(s=>s.bonus).length,f=S.secFilter||'all';
  let h=`<div class="card secsum"><div style="display:flex;align-items:baseline;gap:10px"><span class="big num">${tot}</span><span>XP de groupe<br>issue des secrets</span></div><div class="muted small" style="text-align:right">${nt}/${L.length} titres<br>${nb} bonus de secret complété</div></div>`;
  h+=`<div class="chips" style="margin-top:12px">${[['all','Tous',L.length],['open','Révélés',nt],['sealed','Scellés',L.length-nt]].map(([k,l,n])=>`<button class="chip" data-act="secFilter" data-v="${k}" aria-pressed="${f===k}">${l} · ${n}</button>`).join('')}</div>`;
  h+=`<div class="legend"><span><span class="g-vm">◆</span> vérité majeure +3</span><span><span class="g-vmin">●</span> mineure +2</span><span><span class="g-h">■</span> indice +1</span><span>titre +1 · bonus +${SEC_BONUS}</span></div>`;
  const shown=L.filter(s=>f==='all'||(f==='open'?!!s.titre:!s.titre));
  h+=`<div class="secgrid">`+shown.map(s=>{
    const row=k=>{const [a,t]=secCount(s,k);return `<span class="pp"><span class="g-${k}" aria-hidden="true">${secPips(s,k)}</span><span class="muted">${t?a+'/'+t:''}</span></span>`;};
    return `<button class="card sec${s.titre?'':' sealed'}" data-act="secOpen" data-n="${s.n}" aria-label="${esc(secLabel(s))}, ${secPts(s)} XP"><span class="hd"><span class="rn">${ROMAN[s.n-1]}</span><span class="num">${secPts(s)} XP</span></span><span class="tt">${s.titre?esc(s.titre):'Titre à découvrir'}</span>${row('vm')}${row('vmin')}${row('h')}${s.bonus?'<span class="small done">Bonus remporté</span>':''}</button>`;
  }).join('')+`</div>`;
  return h;
}
function viewSecret(s){
  const [vf,vt]=secCount(s,'vm');
  let h=`<button class="back" data-act="secBack"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Tous les secrets</button>`;
  h+=`<div class="sechead"><div><div class="rn">SECRET ${ROMAN[s.n-1]}</div><h2>${s.titre?esc(s.titre):'<span class="muted">Titre à découvrir</span>'}</h2></div><span class="pts num">${secPts(s)} XP</span></div>`;
  h+=s.titre?`<button class="found" style="padding-top:2px" data-act="secEntry" data-k="titre" data-i="0"><span class="muted small">Titre découvert · +${s.titrePts||1} XP</span></button>`:`<div class="muted small">Le titre n'est pas encore connu (+1 XP).</div>`;
  if(vt){h+=`<div class="card" style="margin-top:14px"><div class="prof-head"><b>Bonus du secret complété</b><span class="pill ${s.bonus?'good':'plan'}">+${SEC_BONUS}</span></div><div class="bgauge" style="grid-template-columns:repeat(${vt},minmax(0,1fr))">${Array.from({length:vt},(_,i)=>`<i class="${i<vf?'on':''}"></i>`).join('')}</div><div class="muted small">${s.bonus?'Remporté : toutes les vérités majeures sont découvertes.':`${vf} vérité${vf>1?'s':''} majeure${vf>1?'s':''} sur ${vt}. Encore ${vt-vf} pour remporter le bonus.`}</div></div>`;}
  for(const k of ['vm','vmin','h']){
    const a=s.slots[k]||[];if(!a.length)continue;const [f,t]=secCount(s,k),K=SKIND[k];
    h+=`<div class="sk"><h3><span class="g-${k}">${K.g}</span> ${K.pl}</h3><span class="muted small">${f}/${t} · ${K.pts} XP ${k==='h'?'chacun':'chacune'}</span></div>`;
    const found=a.map((x,i)=>x?`<button class="found" data-act="secEntry" data-k="${k}" data-i="${i}">${esc(x.txt)}<small>+${x.pts} XP${x.date?' · '+fmtDate(x.date):''}</small></button>`:'').join('');
    if(found)h+=`<div class="card" style="padding:2px 12px">${found}</div>`;
    if(t-f)h+=`<div class="sealedbox">${t-f===1?`${k==='h'?'1 indice encore scellé':'1 '+K.nom.toLowerCase()+' encore scellée'}`:`${t-f} ${K.pl.toLowerCase()} encore ${k==='h'?'scellés':'scellées'}`}</div>`;
  }
  const any=['titre','vm','vmin','h'].some(k=>secFree(s,k));
  h+=`<button class="btn pri cta" data-act="secAdd"${any?'':' disabled'}>${any?'+ Consigner une découverte':'Tout est découvert'}</button>`;
  return h;
}
function secGainPreview(s,k){const p=SKIND[k].pts;const bonus=k==='vm'&&!s.bonus&&secCount(s,'vm')[1]-secCount(s,'vm')[0]===1;return{p,bonus,total:p+(bonus?SEC_BONUS:0)};}

/* Correction unique : deux indices validés mais non cochés dans le tableur (Féérie, Malédiction des faux-semblants).
   Leur XP figure déjà dans l'ancien journal : on les reprend sans XP et on retire les lignes créées s'ils ont été saisis à la main. */
function fixOnce(){
  if(S._fix1Done||!S.secretsReady||!S.eventsReady||S.secretsFix1)return;S._fix1Done=true;
  const L=clone(S.secrets);let evs=S.events,evChanged=false;
  for(const [n,i,re] of [[5,3,/enray/i],[11,3,/th[ée]orie/i]]){
    const b=L.find(z=>z.n===n),a=SECRETS_SEED.find(z=>z.n===n);if(!b||!a||!b.slots||!b.slots.h)continue;
    const j=b.slots.h.findIndex(y=>y&&re.test(y.txt||''));
    if(j>=0){const y=b.slots.h[j];if(y.date){const before=evs.length;evs=evs.filter(e=>!(e.secret&&e.secret.n===n&&e.secret.k==='h'&&e.secret.i===j));if(evs.length!==before)evChanged=true;delete y.date;}}
    else{const k=b.slots.h[i]?b.slots.h.findIndex(y=>!y):i;if(k>=0)b.slots.h[k]=clone(a.slots.h[i]);}
  }
  S.secretsFix1=true;saveSecrets(L);if(evChanged)saveEvents(evs);
}
function saveSecrets(list){S.secrets=list;persist('meta/secrets',{list,fix1:true});}
function secEvent(n,k,i,montant,titre,date,sid){const t=allPJ();if(!t.length)return null;const e={id:'g'+Date.now().toString(36)+'-s'+n+k+i,date,titre,type:SEC_TYPE,secret:{n,k,i},entries:t.map(p=>({perso:p,nature:'Groupe',montant}))};if(sid&&sessById(sid))e.sessionId=sid;return e;}
const secEv=(n,k,i)=>S.events.find(e=>e.secret&&e.secret.n===n&&e.secret.k===k&&e.secret.i===i);
const creEv=id=>S.events.find(e=>e.creature&&e.creature.id===id);
function secConsign(n,k,txt,sid){
  const list=clone(S.secrets),s=list.find(x=>x.n===n);if(!s||!txt||!secFree(s,k))return;
  const d=today(),evs=[...S.events];let ev;
  if(k==='titre'){s.titre=txt;s.titrePts=SKIND.titre.pts;ev=secEvent(n,'titre',0,SKIND.titre.pts,secLabel(s),d,sid);if(ev)evs.push(ev);}
  else{const i=s.slots[k].findIndex(x=>!x);s.slots[k][i]={txt,pts:SKIND[k].pts,date:d};ev=secEvent(n,k,i,SKIND[k].pts,secLabel(s),d,sid);if(ev)evs.push(ev);
    if(k==='vm'&&!s.bonus&&secComplete(s)){s.bonus=true;const b=secEvent(n,'bonus',0,SEC_BONUS,secLabel(s)+' (bonus secret complété)',d,sid);if(b){b.trigger={k,i};evs.push(b);}}}
  saveSecrets(list);saveEvents(evs);
}
function secRemove(n,k,i){
  const list=clone(S.secrets),s=list.find(x=>x.n===n);if(!s)return;
  const drop=[[k,k==='titre'?0:i]];
  if(k==='titre'){s.titre=null;delete s.titrePts;}else s.slots[k][i]=null;
  if(k==='vm'&&s.bonus){s.bonus=false;drop.push(['bonus',0]);}
  const evs=S.events.filter(e=>!(e.secret&&e.secret.n===n&&drop.some(([dk,di])=>e.secret.k===dk&&e.secret.i===di)));
  saveSecrets(list);saveEvents(evs);
}
function secEdit(n,k,i,txt){const list=clone(S.secrets),s=list.find(x=>x.n===n);if(!s||!txt)return;if(k==='titre')s.titre=txt;else if(s.slots[k][i])s.slots[k][i].txt=txt;saveSecrets(list);render();}

const pkey=(y,m,d,sl)=>''+y+String(m+1).padStart(2,'0')+String(d).padStart(2,'0')+sl;
const planPlayers=()=>playersSorted().filter(p=>!p.parti);
const isPref=(wd,sl)=>(wd===6&&sl==='S')||(wd===0&&sl==='J');
function planCount(y,m,d,sl){const P=planPlayers(),k=pkey(y,m,d,sl);return{n:P.filter(p=>p.dispo&&p.dispo[k]).length,who:P.filter(p=>p.dispo&&p.dispo[k]).map(p=>p.nom),total:P.length};}

        `<td style="white-space:nowrap">${['J','S'].map(sl=>{const c=planCount(y,m,d,sl).n;return `<span class="pill${c===T?' good':''}">${sl==='J'?'☀':'☾'} ${c}/${T}</span>`;}).join(' ')}</td></tr>`;}

/* ---------- Prochaines dates ---------- */
const todayKey=()=>today().replace(/-/g,'');
const dkey=d=>d.replace(/-/g,'');
const fmtLong=(iso,sl)=>{const [y,m,d]=iso.split('-').map(Number),wd=new Date(y,m-1,d).getDay();if(sl==='WE'||(sl===undefined&&false))return 'Week-end du '+d+' '+PMOIS[m-1];return PJOURSL[wd].replace(/^./,c=>c.toUpperCase())+' '+d+' '+PMOIS[m-1]+(sl?' · '+(sl==='J'?'journée':'soirée'):'');};
const slLabel=sl=>sl==='WE'?'Samedi soir et dimanche journée':sl==='J'?'Journée':'Soirée';
const isoAdd=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number),t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
/* Une date = un créneau ou une plage de créneaux consécutifs (date/sl → endDate/endSl). 'WE' = ancien format samedi soir → dimanche journée */
const norm=x=>x.sl==='WE'?{date:x.date,sl:'S',endDate:isoAdd(x.date,1),endSl:'J'}:{date:x.date,sl:x.sl,endDate:x.endDate||x.date,endSl:x.endSl||x.sl};
const isRange=x=>{const n=norm(x);return n.endDate!==n.date||n.endSl!==n.sl;};
const dEnd=x=>norm(x).endDate;
const wdOf=iso=>new Date(iso+'T12:00').getDay();
const capi=t=>t.replace(/^./,c=>c.toUpperCase());
function dTitle(x){const n=norm(x);if(!isRange(x))return fmtLong(n.date);
  if(n.date===n.endDate)return fmtLong(n.date);
  const [,m1,d1]=n.date.split('-').map(Number),[,m2,d2]=n.endDate.split('-').map(Number);
  if(wdOf(n.date)===6&&n.sl==='S'&&n.endDate===isoAdd(n.date,1)&&n.endSl==='J')return 'Week-end du '+d1+' '+PMOIS[m1-1];
  return 'Du '+PJOURSL[wdOf(n.date)]+' '+d1+(m1!==m2?' '+PMOIS[m1-1]:'')+' au '+PJOURSL[wdOf(n.endDate)]+' '+d2+' '+PMOIS[m2-1];}
function dSub(x){const n=norm(x);if(!isRange(x))return n.sl==='J'?'Journée':'Soirée';
  if(n.date===n.endDate)return 'Journée et soirée';
  const a=PJOURSL[wdOf(n.date)]+(n.sl==='J'?' journée':' soir'),b=PJOURSL[wdOf(n.endDate)]+(n.endSl==='J'?' journée':' soir');
  return capi(a)+(slotsOf(x).length===2?' et ':' → ')+b;}
function dLine(x){const n=norm(x);if(!isRange(x))return fmtLong(n.date,n.sl);return n.date===n.endDate?fmtLong(n.date)+' · journée et soirée':dTitle(x);}
function slotsOf(x){const n=norm(x),out=[];let d=n.date,sl=n.sl;for(let i=0;i<400;i++){out.push(d+'|'+sl);if(d===n.endDate&&sl===n.endSl)break;if(sl==='J')sl='S';else{sl='J';d=isoAdd(d,1);}}return out;}
const futDates=()=>S.dates.filter(x=>dEnd(x)>=today()).sort((a,b)=>(a.date+a.sl).localeCompare(b.date+b.sl));
const validDates=()=>futDates().filter(x=>x.status==='valid');
const propDates=()=>futDates().filter(x=>x.status!=='valid');
const isMJ=p=>p&&p.role==='MJ'&&!p.parti;
const mjRefus=x=>Object.values(S.players).some(p=>isMJ(p)&&(p.rep||{})[x.id]==='no');
const openProps=()=>propDates().filter(x=>!mjRefus(x));
function saveDates(list){S.dates=list;persist('meta/planning',{dates:list});render();}
function freeSlots(){const pl=planPlayers(),T=pl.length,out=[];if(!T)return out;const t=new Date();
  const used=new Set();for(const x of S.dates)for(const k of slotsOf(x))used.add(k);
  /* créneaux consécutifs libres pour toute la table → une seule date (plage) */
  let run=null;const close=()=>{if(run){out.push(run);run=null;}};
  for(let i=0;i<=90;i++){const dt=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i),y=dt.getFullYear(),m=dt.getMonth(),d=dt.getDate(),wd=dt.getDay();
    const iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    for(const sl of ['J','S']){const free=pl.every(p=>p.dispo&&p.dispo[pkey(y,m,d,sl)])&&!used.has(iso+'|'+sl);
      if(!free){close();continue;}
      if(!run)run={date:iso,sl,endDate:iso,endSl:sl,pf:isPref(wd,sl)};else{run.endDate=iso;run.endSl=sl;run.pf=run.pf||isPref(wd,sl);}}}
  close();
  return out.sort((a,b)=>(b.pf-a.pf)||(a.date+a.sl).localeCompare(b.date+b.sl));}
const dIcon=x=>{const r=isRange(x),n=norm(x);return `<span class="pi"${r?' style="font-size:15px"':''}>${r?(n.sl==='J'?'☀☾':'☾☀'):n.sl==='J'?'☀':'☾'}</span>`;};
function viewNextDates(){
  if(!S.datesReady)return `<div class="card empty">Chargement…</div>`;

async function pushEnable(){
  if(!ME||!S.players[ME]){alertMsg('Choisis d\'abord ton nom dans « Je suis ».');return;}
  try{
    const perm=await Notification.requestPermission();if(perm!=='granted'){S.pushMsg='Notifications refusées. Tu peux les autoriser dans les réglages du navigateur.';render();return;}
    const reg=SWREG||await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    const js=sub.toJSON(),pl=clone(S.players[ME]);pl.push=(pl.push||[]).filter(x=>x.endpoint!==js.endpoint);pl.push.push({endpoint:js.endpoint,keys:js.keys});
    S.pushSub=sub;S.pushMsg='Notifications activées sur cet appareil.';savePlayer(pl);
  }catch(e){console.error(e);S.pushMsg='Activation impossible sur cet appareil.';render();}
}
async function pushDisable(){
  try{const sub=S.pushSub;if(sub){const ep=sub.endpoint;await sub.unsubscribe();for(const p of Object.values(S.players)){if((p.push||[]).some(x=>x.endpoint===ep)){const n=clone(p);n.push=n.push.filter(x=>x.endpoint!==ep);savePlayer(n);}}}
    S.pushSub=null;S.pushMsg='Notifications désactivées sur cet appareil.';render();}catch(e){console.error(e);}
}

}
function render(){

  document.body.classList.toggle('home',S.view==='home');
  {const mb=document.getElementById('meBtn');if(mb){const me=ME&&S.players[ME];const lab=me?esc(me.nom):'Qui es-tu ?';const html=`${ICON.perso}<span>${lab}</span>`;if(mb.innerHTML!==html)mb.innerHTML=html;mb.setAttribute('aria-label',me?'Connecté en tant que '+me.nom+', changer de joueur':'Choisir qui tu es');}}
  const ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest('#app')&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&!S._force){S.dirty=true;renderSheet();return;}
  S._force=false;S.dirty=false;

  const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
  const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>';
  const eff=()=>{const t=document.documentElement.getAttribute('data-theme');return t||(mq&&mq.matches?'dark':'light');};
  function paint(){const d=eff()==='dark';btn.innerHTML=d?SUN:MOON;btn.setAttribute('aria-label',d?'Passer au thème clair':'Passer au thème nuit');
    const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#0f1b1e':'#efe5cf');}
  btn.addEventListener('click',()=>{const n=eff()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('xp.theme',n);}catch(e){}paint();});
  if(mq&&mq.addEventListener)mq.addEventListener('change',paint);
  paint();
})();

/* --- données partagées --- */
function start(){
  render();
  const timer=setTimeout(()=>{if(!S.ready&&!S.gate){setSync('err','Données injoignables pour l\'instant');}},10000);
  getDb().then(db=>{
    if(!db){setSync('local');S.ready=true;render();return;}
    DB=db;
    db.collection('chars').onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      const m={};snap.docs.forEach(d=>{const x=d.data();if(x)m[d.id]=normNoms(x);});
      S.chars=m;S.ready=true;clearTimeout(timer);if(!snap.metadata.fromCache)setSync('ok');render();
    },e=>{setSync('err','Lecture impossible');});
    db.collection('players').onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      const m={};snap.docs.forEach(d=>{const x=d.data();if(x)m[d.id]=x;});
      S.players=m;render();
    },()=>{});
    db.doc('meta/heritage').onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      const x=snap.data();S.heritage={score:x&&x.score!=null?x.score:'',delta:(x&&x.delta)||0};render();
    },()=>{});
    db.doc('meta/secrets').onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      const x=snap.data();
      if(x&&Array.isArray(x.list)&&x.list.length){S.secrets=x.list;S.secretsFix1=!!x.fix1;}
      else{S.secrets=clone(SECRETS_SEED);S.secretsFix1=true;persist('meta/secrets',{list:S.secrets,fix1:true});}
      S.secretsReady=true;fixOnce();render();
    },()=>{});
    db.doc('meta/planning').onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      const x=snap.data();S.dates=(x&&Array.isArray(x.dates))?x.dates:[];S.datesReady=true;render();
    },()=>{});
    db.doc('meta/creatures').onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      const x=snap.data();
      if(x&&Array.isArray(x.list))S.creatures=x.list;
      else{S.creatures=clone(CREATURES_SEED);persist('meta/creatures',{list:S.creatures});}
      S.creaturesReady=true;render();
    },()=>{});
    db.doc('gains/all').onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      const x=snap.data();S.events=(x&&x.events)||[];S.eventsReady=true;fixOnce();render();
    },()=>{});
  }).catch(()=>{setSync('local');S.ready=true;render();});
}
start();
</script>
